# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "v2e-unpack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Compression and boot-image unpacker"

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
thiserror = { version = "2", default-features = false }
crc32fast = { version = "1", default-features = false }
log       = { version = "0.4", default-features = false }

# Compression codecs:
flate2   = { version = "1", default-features = false, features = ["miniz_oxide"] }
xz2      = { version = "0.1" }
lzma-rs  = { version = "0.3", default-features = false }
bzip2-rs = { version = "0.1", default-features = false }
lz4_flex = { version = "0.11", default-features = false, features = ["std", "frame"] }
ruzstd   = { version = "0.7", default-features = true }
