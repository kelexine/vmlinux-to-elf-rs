# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "v2e-db"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Optional kernel-version database access"

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
log = { version = "0.4", default-features = false }
thiserror = { version = "2", default-features = false }

rusqlite = { version = "0.41", default-features = false, features = ["bundled", "cache"], optional = true }
xz2 = { version = "0.1", optional = true }

[features]
# `embedded` compiles the 1.8 MB xz-compressed database into the binary and
# unpacks it on first use (see src/locate.rs), so `cargo install` needs no
# post-install step.
default = ["db", "embedded"]
db = ["dep:rusqlite"]
embedded = ["dep:xz2"]
