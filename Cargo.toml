# SPDX-License-Identifier: GPL-3.0-or-later

[workspace]
resolver = "2"
members = [
    "crates/v2e-elf",
    "crates/v2e-arch",
    "crates/v2e-unpack",
    "crates/v2e-kallsyms",
    "crates/v2e-db",
    "crates/v2e-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90.0"
license = "GPL-3.0-or-later"
authors = ["kelexine <https://github.com/kelexine>"]
repository = "https://github.com/kelexine/vmlinux-to-elf-rs"
description = "Rust port of marin-m/vmlinux-to-elf: recover an analyzable ELF from a raw or compressed Linux kernel image"
readme = "README.md"
keywords = ["vmlinux", "kallsyms", "elf", "linux", "reverse-engineering"]
categories = ["command-line-utilities", "encoding", "parser-implementations"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"
non_camel_case_types = "allow"
non_upper_case_globals = "allow"
dead_code = "allow"
unused_imports = "allow"
unused_variables = "allow"
unused_assignments = "allow"
unused_mut = "allow"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "allow", priority = -1 }
collapsible_if = "allow"
missing_docs_in_private_items = "allow"
missing_const_for_fn = "allow"
needless_borrow = "allow"
needless_range_loop = "allow"
manual_div_ceil = "allow"
op_ref = "allow"
if_same_then_else = "allow"
manual_repeat_n = "allow"
needless_late_init = "allow"
double_ended_iterator_last = "allow"
nonminimal_bool = "allow"
collapsible_else_if = "allow"
ptr_arg = "allow"
field_reassign_with_default = "allow"
needless_pass_by_value = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
doc_markdown = "allow"
match_same_arms = "allow"
struct_excessive_bools = "allow"
cast_possible_wrap = "allow"
cast_possible_truncation = "allow"
similar_names = "allow"
inconsistent_digit_grouping = "allow"
too_many_lines = "allow"
enum_variant_names = "allow"
upper_case_acronyms = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 1
